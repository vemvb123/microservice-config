server.port=8080

# JWT used by this project
security.jwt.secret=4A614E645267556B58703273357638782F413F4428472B4B6250655368566D59

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# Authentication service
spring.cloud.gateway.server.webflux.routes[0].id=authentication
spring.cloud.gateway.server.webflux.routes[0].uri=lb://authentication
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Reddit service
spring.cloud.gateway.server.webflux.routes[1].id=reddit-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://reddit-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/**

# Logging
logging.file.name=logs/gateway.log

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always


spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@userKeyResolver}
